services:
  postgres:
    image: postgres:16-alpine
    container_name: scratchly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scratchly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scratchly_secret}
      POSTGRES_DB: ${POSTGRES_DB:-scratchly_mail}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
